<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a1631"/>
      <stop offset="50%" stop-color="#471126"/>
      <stop offset="100%" stop-color="#2b0716"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf2d8"/>
      <stop offset="35%" stop-color="#e4d3a0"/>
      <stop offset="70%" stop-color="#c4a252"/>
      <stop offset="100%" stop-color="#9b792b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Badge Base -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)"/>

  <!-- Gold Ring Border -->
  <circle cx="64" cy="64" r="57.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="53.5" fill="none" stroke="#e4d3a0" stroke-width="0.8" stroke-dasharray="2.5 2" opacity="0.6"/>

  <!-- Decorative Crest Elements -->
  <g fill="url(#goldGrad)">
    <!-- Top 4-point Star -->
    <path d="M 64 19 L 65.4 24.2 L 70.6 25.6 L 65.4 27 L 64 32.2 L 62.6 27 L 57.4 25.6 L 62.6 24.2 Z"/>
    <!-- Bottom Triple Dots -->
    <circle cx="55" cy="107" r="1.6" opacity="0.8"/>
    <circle cx="64" cy="107" r="2.4"/>
    <circle cx="73" cy="107" r="1.6" opacity="0.8"/>
  </g>

  <!-- DP Monogram (Djie Production) -->
  <g fill="url(#goldGrad)" filter="url(#glow)" fill-rule="evenodd">
    <!-- Letter 'D' with refined serif -->
    <path d="M 26 38 L 47.5 38 C 58.5 38 65.5 45 65.5 64 C 65.5 83 58.5 90 47.5 90 L 26 90 L 26 84.5 L 31 84.5 L 31 43.5 L 26 43.5 Z M 40 47.5 L 46 47.5 C 53 47.5 56 52.5 56 64 C 56 75.5 53 80.5 46 80.5 L 40 80.5 Z"/>
    <!-- Letter 'P' with refined serif -->
    <path d="M 67.5 38 L 88.5 38 C 99 38 105.5 44 105.5 55 C 105.5 66 99 72 88.5 72 L 78.5 72 L 78.5 84.5 L 83.5 84.5 L 83.5 90 L 67.5 90 L 67.5 84.5 L 71.5 84.5 L 71.5 43.5 L 67.5 43.5 Z M 78.5 47.5 L 86.5 47.5 C 92 47.5 95.5 50.5 95.5 55 C 95.5 59.5 92 62.5 86.5 62.5 L 78.5 62.5 Z"/>
  </g>
</svg>
